<!DOCTYPE html>
<!--
  popup-preview.html — Dev preview wrapper

  Opens src/popup/popup.html centered in a browser tab so you can
  work on the popup UI without installing the extension.

  Chrome API calls are shimmed automatically in popup.js when
  chrome.runtime.id is absent.

  Usage:
    open popup-preview.html          (macOS)
    python3 -m http.server 3000      (then visit localhost:3000/popup-preview.html)

  To test dark mode:
    DevTools → Rendering → "Emulate CSS media feature prefers-color-scheme" → dark

  To test at real extension width (380px):
    DevTools → device toolbar → set width to 380
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snapr — Popup Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: #E2DBD1;
      font-family: 'Geist Mono', monospace;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #0E0C0A; }
    }

    .label {
      font-size: 10px;
      letter-spacing: 0.1em;
      color: #A89880;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .popup-frame {
      width: 380px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.10);
    }
  </style>
</head>
<body>
  <p class="label">Snapr — Popup Preview</p>
  <div class="popup-frame">
    <iframe
      src="src/popup/popup.html"
      width="380"
      style="border:none; display:block; height:520px"
      id="frame"
    ></iframe>
  </div>

  <script>
    // Auto-size the iframe to match popup content height
    const frame = document.getElementById('frame');
    frame.addEventListener('load', () => {
      try {
        const h = frame.contentDocument.body.scrollHeight;
        if (h > 0) frame.style.height = h + 'px';
      } catch (e) {
        // cross-origin — leave default height
      }
    });
  </script>
</body>
</html>
